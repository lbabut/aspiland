name: Secret change guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: secret-change-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-change-range:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - name: Resolve commit range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="${PR_BASE}..HEAD"
          elif [[ -n "${PUSH_BEFORE:-}" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            range="${PUSH_BEFORE}..HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            range="HEAD^..HEAD"
          else
            range="HEAD"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Scanning commit range without printing findings or values."

      - name: Scan changed commits with fully redacted output
        id: scan
        continue-on-error: true
        run: >-
          python3 scripts/run_secret_history_scan.py
          --period "change-range"
          --log-opts "${{ steps.range.outputs.range }}"
          --summary "${RUNNER_TEMP}/safe-secret-summary/change-range.json"

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-secret-summary-change-range
          path: ${{ runner.temp }}/safe-secret-summary/change-range.json
          if-no-files-found: error
          retention-days: 1

      - name: Enforce no new secret candidates
        if: always()
        shell: bash
        run: |
          summary="${RUNNER_TEMP}/safe-secret-summary/change-range.json"
          python3 - "$summary" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)

          status = result["status"]
          count = result["suspected_findings"]
          print(f"Sanitized change-range result: status={status}, suspected_findings={count}")
          for rule_id, rule_count in result["rule_counts"].items():
              print(f"Rule summary: {rule_id}: {rule_count}")

          if status != "passed":
              raise SystemExit(1)
          PY
