name: Secret remediation locate

on:
  pull_request:
    paths:
      - ".github/workflows/secret-remediation-locate.yml"
      - "scripts/run_secret_history_scan.py"
      - "scripts/audit-remediation-public.pem"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - name: Produce redacted and restricted reports
        id: scan
        continue-on-error: true
        run: >-
          python3 scripts/run_secret_history_scan.py
          --period "2025-q2"
          --log-opts "--all --since=2025-04-01 --until=2025-07-01"
          --summary "${RUNNER_TEMP}/safe-secret-summary/2025-q2.json"
          --restricted-locations "${RUNNER_TEMP}/restricted-secret-locations/2025-q2.json"

      - name: Encrypt remediation locations when needed
        shell: bash
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/safe-secret-summary/2025-q2.json"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$summary")"
          if [[ "$status" != "findings" ]]; then
            rm -f "${RUNNER_TEMP}/restricted-secret-locations/2025-q2.json"
            exit 0
          fi

          output="${RUNNER_TEMP}/encrypted-remediation-2025-q2"
          mkdir -p "$output"
          openssl rand -out "${RUNNER_TEMP}/audit-key.bin" 32
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass file:"${RUNNER_TEMP}/audit-key.bin" \
            -in "${RUNNER_TEMP}/restricted-secret-locations/2025-q2.json" \
            -out "$output/locations.enc"
          openssl pkeyutl -encrypt -pubin \
            -inkey scripts/audit-remediation-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "${RUNNER_TEMP}/audit-key.bin" \
            -out "$output/key.enc"
          rm -f "${RUNNER_TEMP}/restricted-secret-locations/2025-q2.json" \
            "${RUNNER_TEMP}/audit-key.bin"

      - name: Upload encrypted remediation map when present
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-remediation-2025-q2
          path: ${{ runner.temp }}/encrypted-remediation-2025-q2/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload sanitized summary
        uses: actions/upload-artifact@v4
        with:
          name: safe-secret-summary-2025-q2-locate
          path: ${{ runner.temp }}/safe-secret-summary/2025-q2.json
          if-no-files-found: error
          retention-days: 1

      - name: Report sanitized result
        shell: bash
        run: |
          python3 - "${RUNNER_TEMP}/safe-secret-summary/2025-q2.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)
          print(
              f"Sanitized result: status={result['status']}, "
              f"suspected_findings={result['suspected_findings']}"
          )
          if result["status"] == "scanner-error":
              raise SystemExit(1)
          PY
