name: Secret remediation locate

on:
  pull_request:
    paths:
      - ".github/workflows/secret-remediation-locate.yml"
      - "scripts/run_secret_history_scan.py"
      - "scripts/audit-remediation-public.pem"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - name: Produce redacted and restricted reports
        id: scan
        continue-on-error: true
        run: >-
          python3 scripts/run_secret_history_scan.py
          --period "through-2022"
          --log-opts "--all --until=2023-01-01"
          --summary "${RUNNER_TEMP}/safe-secret-summary/through-2022.json"
          --restricted-locations "${RUNNER_TEMP}/restricted-secret-locations/through-2022.json"

      - name: Encrypt remediation locations
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/encrypted-remediation-through-2022"
          mkdir -p "$output"
          openssl rand -out "${RUNNER_TEMP}/audit-key.bin" 32
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass file:"${RUNNER_TEMP}/audit-key.bin" \
            -in "${RUNNER_TEMP}/restricted-secret-locations/through-2022.json" \
            -out "$output/locations.enc"
          openssl pkeyutl -encrypt -pubin \
            -inkey scripts/audit-remediation-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "${RUNNER_TEMP}/audit-key.bin" \
            -out "$output/key.enc"
          rm -f "${RUNNER_TEMP}/restricted-secret-locations/through-2022.json" \
            "${RUNNER_TEMP}/audit-key.bin"

      - name: Upload encrypted remediation map
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-remediation-through-2022
          path: ${{ runner.temp }}/encrypted-remediation-through-2022/
          if-no-files-found: error
          retention-days: 1

      - name: Upload sanitized summary
        uses: actions/upload-artifact@v4
        with:
          name: safe-secret-summary-through-2022-locate
          path: ${{ runner.temp }}/safe-secret-summary/through-2022.json
          if-no-files-found: error
          retention-days: 1

      - name: Confirm suspected findings remain
        shell: bash
        run: |
          python3 - "${RUNNER_TEMP}/safe-secret-summary/through-2022.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)
          print(
              f"Restricted remediation map created for "
              f"{result['suspected_findings']} suspected finding(s)."
          )
          if result["status"] != "findings":
              raise SystemExit(1)
          PY
