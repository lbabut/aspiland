name: Legacy privacy audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-privacy-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-current-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan targeted legacy and generated areas
        run: >-
          python3 scripts/run_legacy_privacy_scan.py
          --summary "${RUNNER_TEMP}/legacy-privacy/summary.json"
          --details "${RUNNER_TEMP}/legacy-privacy/details.json"

      - name: Upload sanitized summary
        uses: actions/upload-artifact@v4
        with:
          name: legacy-privacy-safe-summary
          path: ${{ runner.temp }}/legacy-privacy/summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Package flagged media for encrypted review
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/legacy-privacy/details.json" "${RUNNER_TEMP}/legacy-privacy/media.tar" <<'PY'
          import json
          import sys
          import tarfile
          from pathlib import Path

          details_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          media_suffixes = {".gif", ".jpeg", ".jpg", ".png", ".webp"}
          items = json.loads(details_path.read_text(encoding="utf-8"))
          paths = sorted({
              Path(str(item["path"]))
              for item in items
              if Path(str(item["path"])).suffix.lower() in media_suffixes
              and Path(str(item["path"])).is_file()
          })
          with tarfile.open(output_path, "w") as archive:
              for path in paths:
                  archive.add(path, arcname=str(path), recursive=False)
          print(f"Packaged {len(paths)} media file(s); filenames suppressed from logs.")
          PY

      - name: Encrypt restricted review materials
        shell: bash
        run: |
          set -euo pipefail
          details_file="${RUNNER_TEMP}/legacy-privacy/details.json"
          media_file="${RUNNER_TEMP}/legacy-privacy/media.tar"
          output_dir="${RUNNER_TEMP}/legacy-privacy-encrypted"
          mkdir -p "$output_dir"
          openssl rand -out "${RUNNER_TEMP}/privacy-key.bin" 32
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass file:"${RUNNER_TEMP}/privacy-key.bin" \
            -in "$details_file" \
            -out "$output_dir/details.enc"
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass file:"${RUNNER_TEMP}/privacy-key.bin" \
            -in "$media_file" \
            -out "$output_dir/media.enc"
          openssl pkeyutl -encrypt -pubin \
            -inkey scripts/privacy-audit-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "${RUNNER_TEMP}/privacy-key.bin" \
            -out "$output_dir/key.enc"
          rm -f "$details_file" "$media_file" "${RUNNER_TEMP}/privacy-key.bin"

      - name: Upload encrypted review materials
        uses: actions/upload-artifact@v4
        with:
          name: legacy-privacy-encrypted-review
          path: ${{ runner.temp }}/legacy-privacy-encrypted/
          if-no-files-found: error
          retention-days: 1

      - name: Report sanitized result
        shell: bash
        run: |
          python3 - "${RUNNER_TEMP}/legacy-privacy/summary.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)

          print(
              "Legacy privacy audit: "
              f"status={result['status']}, "
              f"files_considered={result['files_considered']}, "
              f"suspected_locations={result['suspected_locations']}"
          )
          for rule_id, count in result["rule_counts"].items():
              print(f"Rule summary: {rule_id}: {count}")
          for group, count in result["group_counts"].items():
              print(f"Group summary: {group}: {count}")
          PY
