name: Secret history scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan-${{ matrix.period }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - period: through-2022
            log_opts: "--all --until=2023-01-01"
          - period: "2023"
            log_opts: "--all --since=2023-01-01 --until=2024-01-01"
          - period: "2024"
            log_opts: "--all --since=2024-01-01 --until=2025-01-01"
          - period: "2025"
            log_opts: "--all --since=2025-01-01 --until=2026-01-01"
          - period: 2026-plus
            log_opts: "--all --since=2026-01-01"
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan period with fully redacted output
        shell: bash
        env:
          PERIOD: ${{ matrix.period }}
          LOG_OPTS: ${{ matrix.log_opts }}
        run: |
          set +e
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -v "${RUNNER_TEMP}:/reports" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
            --log-opts="${LOG_OPTS}" \
            --redact=100 \
            --no-banner \
            --no-color \
            --log-level=error \
            --report-format=json \
            --report-path="/reports/gitleaks-${PERIOD}.json" \
            --timeout=1200 \
            >/dev/null 2>&1
          status=$?
          set -e

          report="${RUNNER_TEMP}/gitleaks-${PERIOD}.json"
          if [[ -s "$report" ]]; then
            python3 - "$report" "$PERIOD" <<'PY'
          import collections
          import json
          import sys

          report_path, period = sys.argv[1:]
          with open(report_path, encoding="utf-8") as handle:
              findings = json.load(handle)

          counts = collections.Counter(
              finding.get("RuleID", "unknown") for finding in findings
          )
          print(f"::error::Secret scan found {len(findings)} suspected finding(s) in period {period}; values and locations are not printed.")
          for rule_id, count in sorted(counts.items()):
              print(f"Rule summary: {rule_id}: {count}")
          PY
            rm -f "$report"
            exit 1
          fi

          rm -f "$report"
          if [[ $status -ne 0 ]]; then
            echo "::error::Secret scan for period ${PERIOD} did not complete successfully; scanner output was suppressed to avoid disclosure."
            exit "$status"
          fi

          echo "Secret scan passed for period ${PERIOD}."
