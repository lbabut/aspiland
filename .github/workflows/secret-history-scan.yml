name: Secret history scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan-${{ matrix.period }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - period: through-2022
            log_opts: "--all --until=2023-01-01"
          - period: "2023"
            log_opts: "--all --since=2023-01-01 --until=2024-01-01"
          - period: "2024"
            log_opts: "--all --since=2024-01-01 --until=2025-01-01"
          - period: 2025-q1
            log_opts: "--all --since=2025-01-01 --until=2025-04-01"
          - period: 2025-q2
            log_opts: "--all --since=2025-04-01 --until=2025-07-01"
          - period: 2025-q3
            log_opts: "--all --since=2025-07-01 --until=2025-10-01"
          - period: 2025-q4
            log_opts: "--all --since=2025-10-01 --until=2026-01-01"
          - period: 2026-h1
            log_opts: "--all --since=2026-01-01 --until=2026-07-01"
          - period: 2026-h2
            log_opts: "--all --since=2026-07-01"
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - name: Scan period with fully redacted output
        id: scan
        continue-on-error: true
        run: >-
          python3 scripts/run_secret_history_scan.py
          --period "${{ matrix.period }}"
          --log-opts "${{ matrix.log_opts }}"
          --summary "${RUNNER_TEMP}/safe-secret-summary/${{ matrix.period }}.json"
          --restricted-locations "${RUNNER_TEMP}/restricted-secret-locations/${{ matrix.period }}.json"

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-secret-summary-${{ matrix.period }}
          path: ${{ runner.temp }}/safe-secret-summary/${{ matrix.period }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Encrypt restricted remediation map
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/safe-secret-summary/${{ matrix.period }}.json"
          restricted="${RUNNER_TEMP}/restricted-secret-locations/${{ matrix.period }}.json"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$summary")"

          if [[ "$status" != "findings" ]]; then
            rm -f "$restricted"
            exit 0
          fi

          output="${RUNNER_TEMP}/encrypted-remediation-${{ matrix.period }}"
          mkdir -p "$output"
          openssl rand -out "${RUNNER_TEMP}/audit-key.bin" 32
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass file:"${RUNNER_TEMP}/audit-key.bin" \
            -in "$restricted" \
            -out "$output/locations.enc"
          openssl pkeyutl -encrypt -pubin \
            -inkey scripts/audit-remediation-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "${RUNNER_TEMP}/audit-key.bin" \
            -out "$output/key.enc"
          rm -f "$restricted" "${RUNNER_TEMP}/audit-key.bin"

      - name: Upload encrypted remediation map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-remediation-${{ matrix.period }}
          path: ${{ runner.temp }}/encrypted-remediation-${{ matrix.period }}/
          if-no-files-found: ignore
          retention-days: 1

      - name: Enforce scan result
        if: always()
        shell: bash
        run: |
          summary="${RUNNER_TEMP}/safe-secret-summary/${{ matrix.period }}.json"
          python3 - "$summary" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              result = json.load(handle)

          period = result["period"]
          status = result["status"]
          count = result["suspected_findings"]
          print(f"Sanitized result for {period}: status={status}, suspected_findings={count}")
          for rule_id, rule_count in result["rule_counts"].items():
              print(f"Rule summary: {rule_id}: {rule_count}")

          if status != "passed":
              raise SystemExit(1)
          PY
